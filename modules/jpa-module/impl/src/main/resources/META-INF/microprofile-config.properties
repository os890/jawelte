# jpa-module's module-level defaults. Loaded at the standard
# microprofile-config.properties ordinal of 100 -- consumers override
# any value here by shipping their own microprofile-config.properties
# with `config_ordinal` set higher than 100, by setting a system
# property (ordinal 400), or by setting an environment variable
# (ordinal 300).

# Package prefixes the EntityScanner default impl
# (XbeanFinderEntityScanner) filters out during its classpath
# scan. Covers the JDK, the Jakarta APIs, the bundled Hibernate /
# H2 / CDI runtimes, common test-time libraries (Mockito,
# ByteBuddy, JUnit, OpenTest4J, xbean-finder), and jawelte's own
# internals.
org.os890.jawelte.module.jpa.scan-exclude-packages=\
    java.,\
    javax.,\
    jakarta.,\
    org.hibernate.,\
    org.h2.,\
    org.jboss.weld.,\
    org.apache.openwebbeans.,\
    org.apache.webbeans.,\
    org.apache.xbean.,\
    org.mockito.,\
    net.bytebuddy.,\
    org.junit.,\
    org.opentest4j.,\
    org.os890.jawelte.core.,\
    org.os890.jawelte.module.
