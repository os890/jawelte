# jta-module's module-level defaults. Loaded at the standard
# microprofile-config.properties ordinal of 100 -- consumers override
# any value here by shipping their own microprofile-config.properties
# with `config_ordinal` set higher than 100, by setting a system
# property (ordinal 400), or by setting an environment variable
# (ordinal 300).

# Default XADataSource implementation that JtaPersistencePropertyResolver
# instantiates per persistence unit. H2's standalone XA data source
# matches the project's test stack out of the box. Consumers running
# against another database swap this for e.g.
# org.postgresql.xa.PGXADataSource or
# com.mysql.cj.jdbc.MysqlXADataSource -- the JavaBean shape (no-arg
# ctor + setURL / setUser / setPassword) is the JDBC convention every
# major vendor follows.
org.os890.jawelte.module.jta.xa-data-source-class=org.h2.jdbcx.JdbcDataSource
