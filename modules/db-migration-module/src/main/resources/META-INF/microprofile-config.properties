# Tables a schema-migration tool keeps its own record in. They are not
# test data: they say what has already been applied, and emptying them
# while leaving the DDL they describe puts the next migration run in
# front of a schema no history remembers. The resulting failure is
# indirect - the class passes alone and fails in a suite - so the
# default is here rather than left to each consumer to discover.
#
# Contributed to jpa-module's cleanup exclusion list additively, so a
# consumer naming a home-grown history table keeps these too. To drop
# one, override this key in a higher-ordinal config source.
#
# Flyway lowercases its table and Liquibase uppercases its two; the
# matching is case-insensitive, and both spellings are written here as
# the tools themselves write them.

org.os890.jawelte.module.dbmigration.cleanup.exclude-tables=\
    flyway_schema_history,\
    schema_version,\
    DATABASECHANGELOG,\
    DATABASECHANGELOGLOCK
