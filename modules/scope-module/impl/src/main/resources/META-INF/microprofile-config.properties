# scope-module's module-level defaults. Loaded at the standard
# microprofile-config.properties ordinal of 100 -- consumers override
# any value here by shipping their own microprofile-config.properties
# with `config_ordinal` set higher than 100, by setting a system
# property (ordinal 400), or by setting an environment variable
# (ordinal 300).

# Default CDI scope for auto-mock synthetic beans of non-JDK target
# types when scope-module is on the classpath. Read by cdi-module's
# TestBeansCdiExtension via MP Config; the FQCN is loaded
# reflectively, so this file is the only place that names the
# TestMethodScoped annotation. cdi-module falls back to
# @RequestScoped when the key is unset or the configured class is
# unloadable.
org.os890.jawelte.module.cdi.auto-mock.default-scope=\
    org.os890.jawelte.module.scope.api.TestMethodScoped

# Default CDI scope for the WireMockServerRegistry bean (which
# carries the impl-internal @WireMockManagedScope marker) when
# scope-module is on the classpath. Read by wiremock-module's
# WireMockRegistryScopeRemap via MP Config; the FQCN is loaded
# reflectively, so this file is the only place that names the
# TestClassScoped annotation for this binding. The registry stays
# @ApplicationScoped when the key is unset or the configured class
# is unloadable.
org.os890.jawelte.module.wiremock.registry.default-scope=\
    org.os890.jawelte.module.scope.api.TestClassScoped

# Default CDI scope for beans claimed by ejb-module's
# DefaultEjbAnnotationMapper via @jakarta.ejb.Singleton when
# scope-module is on the classpath. Read by ejb-module's
# DefaultEjbAnnotationMapper via MP Config; the FQCN is loaded
# reflectively, so this file is the only place that names the
# TestClassScoped annotation for this binding. ejb-module falls
# back to @ApplicationScoped when the key is unset or the
# configured class is unloadable.
org.os890.jawelte.module.ejb.singleton.default-scope=\
    org.os890.jawelte.module.scope.api.TestClassScoped

# Default CDI scope for jaxrs-module's TestUrlHolder bean (which
# carries the impl-internal @JaxRsManagedScope marker) when
# scope-module is on the classpath. Read by jaxrs-module's
# TestUrlScopeRemap via MP Config; the FQCN is loaded reflectively,
# so this file is the only place that names the TestClassScoped
# annotation for this binding. TestUrlHolder stays @ApplicationScoped
# when the key is unset or the configured class is unloadable.
org.os890.jawelte.module.jaxrs.test-url.default-scope=\
    org.os890.jawelte.module.scope.api.TestClassScoped
