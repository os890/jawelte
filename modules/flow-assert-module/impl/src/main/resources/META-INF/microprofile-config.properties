# flow-assert-module's bundled defaults. Loaded at the standard
# microprofile-config.properties ordinal of 100 -- consumers override
# any value here by shipping their own microprofile-config.properties
# with `config_ordinal` set higher than 100, by setting a system
# property (ordinal 400), or by setting an environment variable
# (ordinal 300).
#
# The cdi-flow.* keys the recorder itself reads are NOT defaulted here:
# they are derived per test class from @EnableFlowAssert and
# contributed by FlowRecordingConfigSource at ordinal 250, which keeps
# a -Dcdi-flow.* override winning over the annotation.

# Regular expressions added to the exclude-pattern of every recording,
# on top of whatever @EnableFlowAssert(exclude = ...) contributes. The
# recorder matches them against the whole bean-class-name, so each
# entry has to match a full name. jawelte's own beans are in here
# because a diagram is about the application under test, not about the
# framework running it -- the same reasoning as cdi-module's
# auto-mock exclude list. The two prefixes are the framework's own
# packages, exactly as ejb-module's scan-exclude list names them:
# jawelte's *test* beans live under org.os890.jawelte.tests and stay
# recordable. The test class itself is added programmatically unless
# @EnableFlowAssert(recordTestClass = true) asks for it.
org.os890.jawelte.module.flowassert.api.FlowAssertConfig.exclude=\
    org\\.os890\\.jawelte\\.core\\..*,\
    org\\.os890\\.jawelte\\.module\\..*

# Call patterns every assertion ignores, on top of whatever
# FlowDiff.Builder#ignoring(...) adds. Format: Participant#signature
# with * as the wildcard, e.g. AuditService#log(*). Empty by default --
# a project with one genuinely uninteresting collaborator names it
# here once instead of in every test.
org.os890.jawelte.module.flowassert.api.FlowAssertConfig.ignore=

# Whether durations, timestamps and thread-names take part in the
# comparison. They differ on every run, so they do not.
org.os890.jawelte.module.flowassert.api.FlowAssertConfig.compare-timings=false

# Whether a failed assertion writes the recording to disk, so the
# whole diagram can be looked at (or copied over the expected file)
# rather than only read in the failure message.
org.os890.jawelte.module.flowassert.api.FlowAssertConfig.write-actual=true

# Where that recording is written, relative to the module's working
# directory. One file per test method:
# <directory>/<TestClass>/<method>.actual.<extension>
org.os890.jawelte.module.flowassert.api.FlowAssertConfig.actual-directory=target/flow-diagrams

# Whether a missing expected resource is created from the recording
# instead of failing with "not found". Off by default: an approval
# that appears on its own is not an assertion. The run that creates
# the file still fails, so the file is reviewed before it is trusted.
org.os890.jawelte.module.flowassert.api.FlowAssertConfig.create-missing-expected=false

# Source directory a newly created expected file is written to,
# relative to the module's working directory.
org.os890.jawelte.module.flowassert.api.FlowAssertConfig.create-missing-expected-directory=src/test/resources

# Classpath directory the convention-based lookup of @ExpectedFlow
# starts from. The probed resource is
# <base>/<TestClassSimpleName>/<methodName><extension>, with the
# extension taken from every registered dialect in priority order.
org.os890.jawelte.module.flowassert.api.FlowAssertConfig.expected-base-directory=flows
