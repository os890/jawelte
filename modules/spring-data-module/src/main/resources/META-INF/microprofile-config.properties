# spring-data-module's module-level defaults. Loaded at the
# standard microprofile-config.properties ordinal of 100 --
# consumers override any value here by shipping their own
# microprofile-config.properties with `config_ordinal` set higher
# than 100, by setting a system property (ordinal 400), or by
# setting an environment variable (ordinal 300).

# spring-data-module's contribution to cdi-module's auto-mock
# target-type exclude list. Discovered via the
# ConfigKeyAliasProvider SPI (SpringDataConfigKeyAliasProvider maps
# the logical key
# `org.os890.jawelte.module.cdi.auto-mock.exclude-packages` to this
# key); DefaultExcludedPackageFilter merges the value below with
# every other contributor's value and with the consumer's own
# user-override value at the owner key. The default shields user
# Spring Data repository interfaces from cdi-module's auto-mocker:
# the filter walks the supertype hierarchy of every candidate type
# and excludes any type whose hierarchy crosses
# `org.springframework.data.*` (which every user repository does,
# transitively through JpaRepository / CrudRepository).
org.os890.jawelte.module.springdata.auto-mock.framework-exclude-packages=\
    org.springframework.data.
