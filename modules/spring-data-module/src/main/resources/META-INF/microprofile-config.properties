# spring-data-module's module-level defaults. Loaded at the
# standard microprofile-config.properties ordinal of 100 --
# consumers override any value here by shipping their own
# microprofile-config.properties with `config_ordinal` set higher
# than 100, by setting a system property (ordinal 400), or by
# setting an environment variable (ordinal 300).

# Extend cdi-module's auto-mock target-package filter so user
# repository interfaces (which extend types in
# org.springframework.data.*) are not auto-mocked when this
# module's CDI extension is on the classpath. The filter walks the
# supertype hierarchy of every candidate type and excludes any
# type whose hierarchy crosses one of these prefixes -- so a user
# `CustomerRepository extends JpaRepository<Customer, Long>` is
# excluded by virtue of JpaRepository living under
# org.springframework.data.jpa.repository. Consumers replace the
# value (the key takes a single comma-separated list, not a merge)
# in a higher-priority MP Config source to add their own
# package prefixes alongside the Spring Data prefix.
org.os890.jawelte.module.cdi.auto-mock.exclude-packages=\
    org.springframework.data.
