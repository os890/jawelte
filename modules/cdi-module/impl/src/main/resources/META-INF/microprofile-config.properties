# Bundled defaults for the framework allowlist used by
# DefaultWhitelistFilter when @EnableTestBeans(limitToTestBeans=true)
# is in effect. Covers java.* / javax.* / jakarta.*, OpenWebBeans /
# Weld internals, Apache DeltaSpike internals, and the framework's
# own root package (org.os890.jawelte.). Downstream applications
# override or extend by setting the same key in a higher-priority
# MP Config source.

org.os890.jawelte.module.cdi.framework-allowlist.packages=\
    java.,\
    javax.,\
    jakarta.,\
    org.jboss.weld.,\
    org.apache.webbeans.,\
    org.apache.deltaspike.,\
    org.os890.jawelte.

# Bundled defaults for the owning-bean exclusion read by
# DefaultExcludedPackageFilter / JpaTypesExcludedPackageFilter in
# isOwningBeanExcluded(). IPs declared by beans under these packages
# are CDI-runtime infrastructure (Weld / OWB / DeltaSpike / SmallRye
# Config decorators, interceptors, producers) which the runtime
# satisfies internally; the auto-mock loop should never reach
# mockFactory.create(...) for them. Downstream applications override
# or extend by setting the same key in a higher-priority MP Config
# source.

org.os890.jawelte.module.cdi.auto-mock.exclude-owning-bean-packages=\
    org.jboss.weld.,\
    org.apache.webbeans.,\
    org.apache.deltaspike.,\
    io.smallrye.
