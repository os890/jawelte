# ejb-module's bundled defaults. Loaded at the standard
# microprofile-config.properties ordinal of 100 -- consumers override
# any value here by shipping their own microprofile-config.properties
# with `config_ordinal` set higher than 100, by setting a system
# property (ordinal 400), or by setting an environment variable
# (ordinal 300).

# Class-level annotations ejb-module observes. The two standard EJB
# session-bean annotations cover the default mapper. A user with an
# additional EjbAnnotationMapper that handles other EJB annotations
# (e.g. @jakarta.ejb.Stateful) extends this list -- the xbean-finder
# classpath scan and the broad ProcessAnnotatedType observer both
# read it.
org.os890.jawelte.module.ejb.bean-defining-annotations=\
    jakarta.ejb.Singleton,\
    jakarta.ejb.Stateless

# Package prefixes the xbean-finder classpath scan filters out
# during BeforeBeanDiscovery. Covers the JDK, the Jakarta APIs,
# the bundled CDI runtimes (Weld, OpenWebBeans), xbean-finder
# itself, common test-time libraries (Mockito, ByteBuddy, JUnit,
# OpenTest4J), SmallRye Config, and jawelte's own internals.
# Consumers override or extend by setting the same key in a
# higher-priority source.
org.os890.jawelte.module.ejb.scan-exclude-packages=\
    java.,\
    javax.,\
    jakarta.,\
    org.hibernate.,\
    org.h2.,\
    org.jboss.weld.,\
    org.apache.openwebbeans.,\
    org.apache.webbeans.,\
    org.apache.xbean.,\
    org.mockito.,\
    net.bytebuddy.,\
    org.junit.,\
    org.opentest4j.,\
    io.smallrye.,\
    org.os890.jawelte.core.,\
    org.os890.jawelte.module.
