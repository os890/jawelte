name: "jawelte Quarkus"
description: "Quarkus-flavour CDI runtime adapter for jawelte. Replaces cdi-module's TestBeanContainerPort under @QuarkusTest; the build-step processor synthesizes @TestBean alternatives and auto-mocks at build time so portable CDI extensions are not required."
metadata:
  keywords:
    - "jawelte"
    - "testing"
    - "cdi"
  categories:
    - "miscellaneous"
  status: "experimental"
