# content-diff-module reads three MP Config keys (see ContentDiff
# constants). The values are comma-separated lists; whitespace around
# each entry is trimmed. The defaults loaded from this file are
# prepended to whatever the caller adds through the builder's
# .ignoring(...) call — never override, never subtract.
#
# This listing pre-configures a JSON ignore pattern that skips every
# `audit.timestamp` field at any depth. Test methods can then assert
# semantic equality without re-stating the ignore on every call.
org.os890.jawelte.module.contentdiff.api.ContentDiff.json.ignore=$..audit.timestamp
