# Higher ordinal so this file wins over ejb-module's own
# microprofile-config.properties (ordinal 100). Adding @Stateful
# to the bean-defining annotation list makes ejb-module's
# xbean-finder scan + ProcessAnnotatedType observer pick up
# @Stateful classes.
config_ordinal=200

org.os890.jawelte.module.ejb.bean-defining-annotations=\
    jakarta.ejb.Singleton,\
    jakarta.ejb.Stateless,\
    jakarta.ejb.Stateful
