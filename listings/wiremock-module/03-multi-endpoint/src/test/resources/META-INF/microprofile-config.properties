# cdi-module's auto-mock extension fires in AfterBeanDiscovery and
# probes injection points whose qualifiers / types it cannot resolve
# from its own scan. wiremock-module's CDI extension also fires in
# AfterBeanDiscovery and registers per-qualifier synthetic beans for
# WireMockServer / WireMock / WireMockRuntimeInfo. The two extensions
# have no explicit ordering — under OWB the auto-mock extension can
# run first, see the @PaymentApi / @InventoryApi qualified IPs as
# unsatisfied, and synthesise a Mockito mock for the upstream types.
# That mock then collides with wiremock-module's later registration
# and CDI raises AmbiguousResolutionException at validation time.
#
# This file opts the upstream WireMock package out of auto-mocking so
# only wiremock-module's beans satisfy the IPs.
org.os890.jawelte.module.cdi.auto-mock.exclude-packages=com.github.tomakehurst.wiremock.
