# Tell db-testdata-module's DbDiff that every table should be
# compared row-as-multiset (no row-order requirement). H2 picks the
# scan index based on heuristics that vary between connections / runs
# - unique-on-name columns surface rows in alphabetical order, PK
# scans surface them in insert order, and the generator's export
# can fall on either side. Multiset matching neutralises that.
org.os890.jawelte.module.dbtestdata.api.DbDiff.unordered-tables=\
ABTEST,ABTESTVARIANT,ACCOUNT,ACTIVITY,ACTIVITYTYPE,ADPLACEMENT,\
ARTICLE,ARTICLE_TAG,AUTHOR,BIN,BUDGET,BUDGETLINE,CAMPAIGN,\
CAMPAIGNCHANNEL,CARRIER,CATEGORY,CHATMESSAGE,CHATSESSION,\
CLICKTRACKING,COMMENT,CONTACT,CONTACTGROUP,CONTENTCATEGORY,\
CONTENTSETTINGS,CONTENTVERSION,COUPON,COUPONUSAGE,CRMCAMPAIGN,\
CURRENCY,CUSTOMER,CUSTOMERORDER,DASHBOARD,DATAEXPORT,DEAL,DEALPRODUCT,\
DELIVERYATTEMPT,DELIVERYZONE,DEPARTMENT,EMPLOYEE,EMPLOYEE_SKILL,\
ESCALATIONRULE,EVENTLOG,EXCHANGERATE,FAQENTRY,FINANCIALTRANSACTION,\
FREIGHTRATE,FUNNEL,FUNNELSTEP,INTERACTION,INVOICE,INVOICELINE,\
KNOWLEDGEARTICLE,LANDINGPAGE,LEADSCORE,LEAVEREQUEST,MEDIA,METRIC,\
NEWSLETTERSUBSCRIPTION,NOTE,OFFICELOCATION,OPPORTUNITY,OPPORTUNITYSTAGE,\
ORDERITEM,PACKAGEDIMENSION,PAGEVIEW,PAYMENT,PIPELINE,PRODUCT,\
