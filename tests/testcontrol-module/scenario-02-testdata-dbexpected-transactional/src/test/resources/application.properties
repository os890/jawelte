# H2 datasource + hibernate-orm config for the @QuarkusTest path.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:scenario-02-testdata-dbexpected-transactional;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.persistence-xml.ignore=true
quarkus.hibernate-orm.database.version-check.enabled=false

# Index the jawelte runtime jars so Quarkus's annotated discovery
# picks up testcontrol / db-testdata beans.
quarkus.index-dependency.testcontrol.group-id=org.os890.jawelte
quarkus.index-dependency.testcontrol.artifact-id=jawelte-testcontrol-module-impl
quarkus.index-dependency.dbtestdata.group-id=org.os890.jawelte
quarkus.index-dependency.dbtestdata.artifact-id=jawelte-db-testdata-module-impl

# Quarkus's ArC removes "unused" beans by default. jawelte's
# TestDataSeedTransactionTemplate / DefaultServicePriorityResolver
# etc. are reached only via programmatic CDI.current().select(...)
# / ServiceLoader, so the build-time removal heuristic mis-identifies
# them as unused. Disable removal for tests.
quarkus.arc.remove-unused-beans=false
