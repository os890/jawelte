quarkus.test.flat-class-path=true

# Default H2 datasource for @QuarkusTest. Mirrors the in-memory PU
# the OWB/Weld path bootstraps from each scenario's persistence.xml.
# Scenarios that need a scenario-specific URL carry their own
# application.properties.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.version-check.enabled=false
# Ignore persistence.xml — under @QuarkusTest Quarkus's hibernate-orm
# wires the default PU from the properties above. The bundled
# persistence.xml exists for the standalone-ArC / OWB / Weld paths.
quarkus.hibernate-orm.persistence-xml.ignore=true
