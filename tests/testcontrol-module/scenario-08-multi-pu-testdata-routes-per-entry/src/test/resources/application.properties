#
# Multi-PU @QuarkusTest config. Two named persistence units, each
# backed by its own H2 in-memory datasource, mirroring the
# persistence.xml the standalone-ArC path uses. Both PUs scan the
# same package — Quarkus has no per-PU entity-class filtering when
# the classes live together, but the test only reads the relevant
# table from each PU, so the cross-listed entities are harmless.
quarkus.datasource.customers.db-kind=h2
quarkus.datasource.customers.jdbc.url=jdbc:h2:mem:scenario08-customers;DB_CLOSE_DELAY=-1
quarkus.datasource.orders.db-kind=h2
quarkus.datasource.orders.jdbc.url=jdbc:h2:mem:scenario08-orders;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm."testcontrolScenario08CustomersPU".datasource=customers
quarkus.hibernate-orm."testcontrolScenario08CustomersPU".packages=org.os890.jawelte.tests.testcontrol.scenario08
quarkus.hibernate-orm."testcontrolScenario08CustomersPU".database.generation=drop-and-create

quarkus.hibernate-orm."testcontrolScenario08OrdersPU".datasource=orders
quarkus.hibernate-orm."testcontrolScenario08OrdersPU".packages=org.os890.jawelte.tests.testcontrol.scenario08
quarkus.hibernate-orm."testcontrolScenario08OrdersPU".database.generation=drop-and-create

quarkus.hibernate-orm.persistence-xml.ignore=true
quarkus.hibernate-orm."testcontrolScenario08CustomersPU".database.version-check.enabled=false
quarkus.hibernate-orm."testcontrolScenario08OrdersPU".database.version-check.enabled=false

# Index the jawelte runtime jars so Quarkus's annotated discovery
# picks up testcontrol / db-testdata beans.
quarkus.index-dependency.testcontrol.group-id=org.os890.jawelte
quarkus.index-dependency.testcontrol.artifact-id=jawelte-testcontrol-module-impl
quarkus.index-dependency.dbtestdata.group-id=org.os890.jawelte
quarkus.index-dependency.dbtestdata.artifact-id=jawelte-db-testdata-module-impl

# Quarkus's ArC removes "unused" beans by default. jawelte's
# TestDataSeedTransactionTemplate is reached only via programmatic
# CDI.current().select(...), so the build-time removal heuristic
# mis-identifies it as unused. Disable removal for tests.
quarkus.arc.remove-unused-beans=false
