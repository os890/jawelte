# Scenario 11 needs InjectSingletonBean (carrying only
# @jakarta.inject.Singleton) to be discoverable so the test can
# assert that ejb-module's default mapper leaves the
# jakarta.inject.Singleton scope alone. Extending the
# bean-defining-annotations list adds that annotation to the
# xbean-finder scan; the class then gets registered via
# addAnnotatedType. The default mapper still ignores it (it only
# acts on @jakarta.ejb.Singleton / @jakarta.ejb.Stateless), so the
# bean's resolved scope stays @jakarta.inject.Singleton.
org.os890.jawelte.module.ejb.bean-defining-annotations=\
    jakarta.ejb.Singleton,\
    jakarta.ejb.Stateless,\
    jakarta.inject.Singleton
