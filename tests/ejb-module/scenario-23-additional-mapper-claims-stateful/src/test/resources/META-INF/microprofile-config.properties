# Scenario 23 ships an additional EjbAnnotationMapper that claims
# @jakarta.ejb.Stateful classes. The annotation isn't in ejb-module's
# default bean-defining-annotations list, so this scenario extends it
# -- the broad ProcessAnnotatedType observer then reaches StatefulSubject
# during ProcessAnnotatedType.
org.os890.jawelte.module.ejb.bean-defining-annotations=\
    jakarta.ejb.Singleton,\
    jakarta.ejb.Stateless,\
    jakarta.ejb.Stateful
