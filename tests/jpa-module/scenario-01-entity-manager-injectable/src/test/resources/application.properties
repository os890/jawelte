# In-memory H2 datasource for jpa scenario-01 under @QuarkusTest.
# Mirrors the persistence.xml-driven testPU01 setup so the same
# @Inject EntityManager assertion passes against Quarkus's own
# hibernate-orm runtime.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testpu01;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Ignore the test-classpath persistence.xml — it's there for the
# standalone-ArC path's PersistenceXmlParser. Under @QuarkusTest the
# datasource + hibernate-orm config is driven entirely by these
# properties, and parsing persistence.xml here would conflict (the
# bundled testPU01 unit has no jdbc.url set, expecting jpa-module's
# TestPersistenceUnitInfo to supply it at runtime).
quarkus.hibernate-orm.persistence-xml.ignore=true

# Disable Hibernate's strict DB-version check — the jawelte test
# classpath pulls H2 2.3.232 (jpa-module/pom.xml's transitive dep
# graph), older than Quarkus's expected 2.4.240. The check is purely
# advisory for these test scenarios.
quarkus.hibernate-orm.database.version-check.enabled=false
