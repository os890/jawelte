quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testpu01;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# The persistence.xml on the test classpath is for the standalone
# path; under @QuarkusTest the datasource + hibernate-orm config
# comes from this properties file.
quarkus.hibernate-orm.persistence-xml.ignore=true

# H2 2.3.232 (root pom's pinned version) is older than Quarkus's
# expected 2.4.240. The version check is purely advisory for tests.
quarkus.hibernate-orm.database.version-check.enabled=false
