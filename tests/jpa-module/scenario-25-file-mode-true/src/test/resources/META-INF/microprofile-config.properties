#
# Override the framework's file-URL with an in-memory H2 URL: this scenario
# tests the @PersistenceConfig(fileMode=true) "skip subsequent methods"
# lifecycle behaviour, NOT the underlying H2 file-mode itself. Hibernate ORM
# 7's DriverManagerConnectionProviderImpl rejects the AUTO_SERVER file URL
# during the testkit-launched sub-container bootstrap; the in-memory URL
# keeps the test surface focused on the lifecycle assertion.
#
org.os890.jawelte.module.jpa.persistence-property.jakarta.persistence.jdbc.url=\
    jdbc:h2:mem:testPU25-file-mode;DB_CLOSE_DELAY=-1
