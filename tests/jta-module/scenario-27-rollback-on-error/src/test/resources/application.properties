quarkus.test.flat-class-path=true

# Default H2 datasource for @QuarkusTest. Mirrors the in-memory PU
# the OWB/Weld path bootstraps from each scenario's persistence.xml.
# Scenarios that need a scenario-specific URL (named PU, JTA datasource,
# file-mode H2, …) carry their own application.properties.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
# quarkus-jdbc-h2 3.35.3 expects H2 2.4.x; the project pins
# h2.version=2.3.232 for the standalone-ArC / OWB / Weld paths.
# Skip the version check so the slightly-older driver still boots.
quarkus.hibernate-orm.database.version-check.enabled=false
quarkus.hibernate-orm.persistence-xml.ignore=true
quarkus.hibernate-orm.database.generation=drop-and-create
