# Bootstrap defaults for TICKET-003's static accessors on TestContext.
# Each key is the port interface's own full class name; the value is
# the FQCN of an implementation with a public no-arg constructor.
# Downstream projects override these keys in any higher-priority MP
# Config source (system property, environment variable, application
# properties file, ...).

org.os890.jawelte.core.api.port.TestContext=\
    org.os890.jawelte.core.impl.adapter.context.TestContextImpl
org.os890.jawelte.core.api.port.ServicePriorityResolver=\
    org.os890.jawelte.core.impl.adapter.spi.DefaultServicePriorityResolver
